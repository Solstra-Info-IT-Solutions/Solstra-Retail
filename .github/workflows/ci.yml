name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build --workspace @solstra/api

      - name: Run API unit tests
        run: npm test --workspace @solstra/api -- --runInBand

      - name: Build web application
        run: npm run build --workspace @solstra/web

  e2e:
    name: API HTTP E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --name solstra-e2e-mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 40); do
            if docker exec solstra-e2e-mongo mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec solstra-e2e-mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for i in $(seq 1 40); do
            if docker exec solstra-e2e-mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not become primary"
          exit 1

      - name: Run API HTTP E2E tests
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/solstra_retail_test?replicaSet=rs0
          JWT_ACCESS_SECRET: e2e-only-secret-value-with-at-least-32-characters
        run: npm run test:e2e --workspace @solstra/api
